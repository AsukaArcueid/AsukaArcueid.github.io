<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsukaArcueid | Personal Space</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Noto+Sans+SC:wght@300&display=swap" rel="stylesheet">
    <style>
        :root {
            /* 调浅后的配色：冰川蓝渐变 */
            --bg-light: #e0eafc;
            --bg-dark: #cfdef3;
            --accent-blue: #4facfe;
            --text-color: #2d3436;
            --glass-white: rgba(255, 255, 255, 0.6);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            /* 浅蓝色柔和渐变 */
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-dark) 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Noto Sans SC', sans-serif;
            overflow: hidden;
        }

        .hero-container {
            position: relative;
            width: 600px;
            height: 300px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主标题：使用了 Orbitron 字体，更有设计感 */
        .main-title {
            font-family: 'Orbitron', sans-serif;
            font-size: 3.5rem;
            font-weight: 800;
            color: var(--text-color);
            letter-spacing: 4px;
            cursor: default;
            transition: all 0.6s cubic-bezier(0.165, 0.84, 0.44, 1);
            z-index: 2;
        }

        /* 悬停时的导航层 */
        .nav-layer {
            position: absolute;
            display: flex;
            gap: 40px;
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 3;
        }

        .nav-item {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: var(--glass-white);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: var(--text-color);
            font-weight: bold;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            transform: translateY(-10px);
            background: #fff;
            box-shadow: 0 15px 35px rgba(79, 172, 254, 0.3);
            color: var(--accent-blue);
        }

        .nav-item span {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.6rem;
            margin-top: 5px;
            letter-spacing: 1px;
            opacity: 0.5;
        }

        /* 交互逻辑 */
        .hero-container:hover .main-title {
            opacity: 0;
            filter: blur(20px);
            transform: scale(1.2);
        }

        .hero-container:hover .nav-layer {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }

        /* 背景装饰点缀：浅色的漂浮圆圈 */
        .decoration {
            position: absolute;
            border-radius: 50%;
            background: white;
            opacity: 0.4;
            filter: blur(50px);
            z-index: 1;
            animation: float 8s infinite alternate ease-in-out;
        }

        @keyframes float {
            0% { transform: translate(0, 0); }
            100% { transform: translate(30px, 50px); }
        }
    </style>
</head>
<body>

    <div class="decoration" style="width: 200px; height: 200px; top: 10%; left: 10%;"></div>
    <div class="decoration" style="width: 300px; height: 300px; bottom: 10%; right: 5%; animation-delay: -2s;"></div>

    <div class="hero-container">
        <h1 class="main-title">AsukaArcueid</h1>

        <nav class="nav-layer">
            <a href="#projects" class="nav-item">
                项目
                <span>PROJECTS</span>
            </a>
            <a href="#courses" class="nav-item">
                课程
                <span>COURSES</span>
            </a>
            <a href="#bio" class="nav-item">
                简介
                <span>BIO</span>
            </a>
        </nav>
    </div>

</body>
</html>
