<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsukaArcueid | Digital Space</title>
    <style>
        :root {
            /* 调色盘：极地蓝与深海黑的融合 */
            --bg-main: #0a0e14;
            --blue-glow: rgba(0, 157, 255, 0.4);
            --glass: rgba(255, 255, 255, 0.05);
            --text-cyan: #00d2ff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-main);
            /* 使用径向渐变消除背景割裂感，模拟深邃的屏幕光感 */
            background-image: radial-gradient(circle at center, #1a2a3a 0%, #0a0e14 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', system-ui, sans-serif;
            overflow: hidden;
            color: white;
        }

        /* 核心交互区域 */
        .hero-container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 呼吸背景光，增加氛围而不晃动 */
        .hero-container::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: var(--blue-glow);
            filter: blur(80px);
            border-radius: 50%;
            z-index: 0;
            opacity: 0.3;
        }

        /* 主标题：常态显示 */
        .main-title {
            font-size: 2.8rem;
            font-weight: 200;
            letter-spacing: 0.2rem;
            color: var(--text-cyan);
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.3);
            transition: all 0.6s ease-in-out;
            z-index: 2;
        }

        /* 导航层：初始隐藏，中心重叠 */
        .nav-layer {
            position: absolute;
            display: flex;
            gap: 20px;
            opacity: 0;
            transform: scale(0.95);
            transition: all 0.5s ease;
            pointer-events: none;
            z-index: 3;
        }

        /* 圆形板块样式 */
        .nav-item {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            background: var(--glass);
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px); /* 毛玻璃效果 */
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-size: 0.9rem;
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background: rgba(0, 210, 255, 0.15);
            border-color: var(--text-cyan);
            box-shadow: 0 0 25px rgba(0, 210, 255, 0.2);
            transform: translateY(-5px);
        }

        .nav-item span {
            font-size: 0.7rem;
            opacity: 0.6;
            margin-top: 4px;
            letter-spacing: 1px;
        }

        /* 触发交互：原地替换 */
        .hero-container:hover .main-title {
            opacity: 0;
            transform: scale(1.1);
            filter: blur(10px);
        }

        .hero-container:hover .nav-layer {
            opacity: 1;
            transform: scale(1);
            pointer-events: auto;
        }
    </style>
</head>
<body>

    <div class="hero-container">
        <h1 class="main-title">AsukaArcueid的主页</h1>

        <nav class="nav-layer">
            <a href="#projects" class="nav-item">
                项目
                <span>PROJECTS</span>
            </a>
            <a href="#courses" class="nav-item">
                课程
                <span>COURSES</span>
            </a>
            <a href="#bio" class="nav-item">
                简历
                <span>BIO</span>
            </a>
        </nav>
    </div>

</body>
</html>
