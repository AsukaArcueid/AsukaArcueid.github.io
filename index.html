<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsukaArcueid | Digital Space</title>
    <style>
        :root {
            /* 科技感配色：深邃蓝到极光紫 */
            --bg-gradient: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            --accent-blue: #00d2ff;
            --glass-bg: rgba(255, 255, 255, 0.1);
            --glass-border: rgba(255, 255, 255, 0.2);
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: var(--bg-gradient);
            font-family: 'Orbitron', 'PingFang SC', sans-serif;
            overflow: hidden;
            color: white;
        }

        /* 核心容器 */
        .stage {
            position: relative;
            width: 400px;
            height: 400px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* 主标题样式 */
        .main-title {
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 10;
            cursor: pointer;
        }

        /* 菜单包裹层 */
        .menu-wrapper {
            position: absolute;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: all 0.5s ease;
        }

        /* 圆形板块样式 */
        .circle-item {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: white;
            font-size: 0.9rem;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .circle-item:hover {
            background: var(--accent-blue);
            transform: scale(1.1) !important;
            box-shadow: 0 0 20px var(--accent-blue);
        }

        .circle-item i {
            font-size: 1.5rem;
            margin-bottom: 5px;
        }

        /* 悬停逻辑：标题隐去，菜单出现并弹出 */
        .stage:hover .main-title {
            opacity: 0;
            transform: scale(0.8);
            filter: blur(10px);
        }

        .stage:hover .menu-wrapper {
            opacity: 1;
            pointer-events: auto;
        }

        /* 板块位置偏移 - 呈三角形分布 */
        .stage:hover .item-projects { transform: translate(0, -110px); }
        .stage:hover .item-courses { transform: translate(-100px, 60px); }
        .stage:hover .item-bio { transform: translate(100px, 60px); }

        /* 背景装饰动画 */
        .bg-glow {
            position: absolute;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(0,210,255,0.15) 0%, transparent 70%);
            animation: pulse 4s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); opacity: 0.5; }
            to { transform: scale(1.5); opacity: 0.8; }
        }
    </style>
</head>
<body>

    <div class="bg-glow"></div>

    <div class="stage">
        <div class="main-title">AsukaArcueid的主页</div>

        <div class="menu-wrapper">
            <a href="#projects" class="circle-item item-projects">
                <span>项目</span>
                <small>Projects</small>
            </a>
            <a href="#courses" class="circle-item item-courses">
                <span>课程</span>
                <small>Courses</small>
            </a>
            <a href="#biography" class="circle-item item-bio">
                <span>简介</span>
                <small>Bio</small>
            </a>
        </div>
    </div>

</body>
</html>
