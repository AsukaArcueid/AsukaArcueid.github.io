<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsukaArcueid</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Noto+Sans+SC:wght@200;300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="decoration" style="width: 250px; height: 250px; top: 5%; left: 5%;"></div>
    <div class="decoration" style="width: 400px; height: 400px; bottom: -5%; right: -5%; animation-delay: -2s;"></div>

    <!-- 状态栏：固定在顶部，始终可见 -->
    <div id="status-bar">
        <span id="status-left">SYSTEM: ONLINE</span>
        <span id="clock">00:00:00</span>
        <span id="status-right">LOC: 31.2397° N, 121.4998° E</span>
    </div>

    <div id="home-screen" class="screen">
        <div id="barrage-container"></div>
        <div class="hero-container">
            <h1 class="main-title">AsukaArcueid</h1>
            <p class="sub-title">Breath of the Stars</p>
            <nav class="nav-layer">
                <div class="nav-item" onclick="navigate('#projects')">项目 <span>PROJECTS</span></div>
                <div class="nav-item" onclick="navigate('#notes')">笔记 <span>NOTES</span></div>
                <div class="nav-item" onclick="navigate('#resources')">资源 <span>RESOURCES</span></div>
                <div class="nav-item" onclick="navigate('#about')">关于 <span>ABOUT</span></div>
            </nav>
        </div>
    </div>

    <div id="projects-screen" class="screen">
        <button onclick="navigate('')" class="back-btn">← BACK</button>
        <div class="project-grid" id="projectGrid"></div>
    </div>

    <div id="notes-screen" class="screen">
        <button onclick="navigate('')" class="back-btn">← BACK</button>
        <div class="project-grid" id="notesGrid"></div>
    </div>

    <div id="resources-screen" class="screen">
        <button onclick="navigate('')" class="back-btn">← BACK</button>
        <div class="filter-bar" id="filterBar"></div>
        <div class="project-grid" id="resourceGrid"></div>
    </div>

    <div id="about-screen" class="screen">
        <button onclick="navigate('')" class="back-btn">← BACK</button>
        <div class="orbit-container" id="orbitContainer">
            <div class="orbit-ring orbit-ring-1"></div>
            <div class="orbit-ring orbit-ring-2"></div>
            <div class="about-avatar-wrapper">
                <img src="images/aboutphoto.jpg" alt="avatar" class="about-avatar">
            </div>
        </div>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="script.js"></script>
</body>
</html>
