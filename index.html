<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AsukaArcueid</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Noto+Sans+SC:wght@200;300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="decoration" style="width: 250px; height: 250px; top: 5%; left: 5%;"></div>
    <div class="decoration" style="width: 400px; height: 400px; bottom: -5%; right: -5%; animation-delay: -2s;"></div>

    <div id="home-screen" class="screen">
        <div class="hero-container">
            <h1 class="main-title">AsukaArcueid</h1>
            <nav class="nav-layer">
                <div class="nav-item" onclick="showProjects()">项目 <span>PROJECTS</span></div>
                <div class="nav-item" onclick="showResources()">资源 <span>RESOURCES</span></div>
                <div class="nav-item">关于 <span>ABOUT</span></div>
            </nav>
        </div>
    </div>

    <div id="projects-screen" class="screen hidden">
        <button onclick="backToHome()" class="back-btn">← BACK</button>
        <div class="project-grid" id="projectGrid"></div>
    </div>

    <div id="resources-screen" class="screen hidden">
        <button onclick="backToHome()" class="back-btn">← BACK</button>
        <div class="filter-bar" id="filterBar"></div>
        <div class="project-grid" id="resourceGrid"></div>
    </div>

    <div id="modal-overlay" class="modal-overlay hidden" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close-modal" onclick="closeModal()">&times;</span>
            <h2 id="modal-title"></h2>
            <div id="modal-body"></div>
        </div>
    </div>

    <script src="db.js"></script>
    <script src="script.js"></script>
</body>
</html>
