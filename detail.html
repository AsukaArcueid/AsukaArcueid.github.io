<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Detail | AsukaArcueid</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Noto+Sans+SC:wght@300;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script>marked.setOptions({ breaks: true });</script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        /* 1. 严格沿用主页定义的变量（与 style.css 保持一致） */
        :root {
            --bg-light: #e0eafc;
            --bg-dark: #cfdef3;
            --accent-blue: #4facfe;
            --text-color: #2d3436;
            --glass-white: rgba(255, 255, 255, 0.6);
            --code-bg: #1e1e1e;
        }

        /* 2. 背景设为与主页一致的渐变 */
        body { 
            background: linear-gradient(135deg, var(--bg-light) 0%, var(--bg-dark) 100%);
            font-family: 'Noto Sans SC', sans-serif; 
            padding: 40px 20px; 
            line-height: 1.8; 
            color: var(--text-color);
            min-height: 100vh;
        }

        /* 3. 容器：移除 backdrop-filter 以修复滚动条白框 Bug */
        .container { 
            max-width: 900px; 
            margin: 60px auto; 
            background: white; /* 这里改回纯白，避免滤镜干扰滚动条 */
            padding: 60px; 
            border-radius: 30px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.05); 
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        /* 4. BACK 按钮：与主页统一样式（详见 style.css .back-btn） */
        .back-btn {
            position: fixed;
            top: 30px; left: 30px;
            width: 120px; height: 45px;
            background: var(--glass-white);
            backdrop-filter: blur(10px);
            border-radius: 50px;
            text-decoration: none;
            color: var(--text-color);
            font-family: 'Orbitron';
            font-size: 0.8rem;
            border: 1px solid rgba(255, 255, 255, 0.4);
            cursor: pointer;
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: 0.3s;
        }
        .back-btn:hover { background: white; color: var(--accent-blue); transform: translateY(-3px); box-shadow: 0 10px 20px rgba(0,0,0,0.05); }

        /* --- 验证正确的滚动条样式区 --- */
        #article-body pre {
            background-color: var(--code-bg) !important;
            padding: 20px;
            padding-bottom: 15px; 
            border-radius: 12px;
            overflow-x: auto;
            margin: 25px 0;
            border: 1px solid #333;
            scrollbar-width: thin;
            scrollbar-color: #555 transparent;
        }

        #article-body pre code {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.9em;
            display: block;
            white-space: pre;
            background: transparent !important;
        }

        #article-body pre::-webkit-scrollbar {
            height: 8px;
            background-color: transparent;
        }

        #article-body pre::-webkit-scrollbar-track {
            background-color: transparent !important;
            border-radius: 10px;
        }

        #article-body pre::-webkit-scrollbar-thumb {
            background-color: #555; 
            border-radius: 10px;
            border: 2px solid var(--code-bg);  
            background-clip: content-box;  
        }

        #article-body pre::-webkit-scrollbar-thumb:hover {
            background-color: #888; 
        }

        #article-body pre::-webkit-scrollbar-corner {
            background: transparent;
        }
        /* --- 滚动条样式结束 --- */

        /* 内容文字样式 */
        #article-body h1, #article-body h2, #article-body h3 { font-family: 'Orbitron', 'Noto Sans SC'; color: var(--text-color); margin-top: 1.5em; }
        #article-body h2 { border-left: 5px solid var(--accent-blue); padding-left: 15px; }
        #article-body p { margin-bottom: 1.5em; color: #444; }
        #article-body img { max-width: 100%; border-radius: 12px; margin: 30px auto; display: block; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        #article-body :not(pre) > code { background-color: #f0f2f5; color: #e06c75; padding: 2px 6px; border-radius: 4px; }
        .loading-tip { text-align: center; color: #999; padding: 50px; font-family: 'Orbitron'; }
        .detail-title { font-family: 'Orbitron'; margin-bottom: 10px; }
        .detail-meta { color: #888; margin-bottom: 40px; font-family: 'Orbitron'; font-size: 0.85em; }

        /* 目录侧边栏 */
        .layout {
            display: flex;
            max-width: 1200px;
            margin: 0 auto;
            padding-left: 260px;
            transition: padding-left 0.3s ease;
        }
        .layout.toc-hidden { padding-left: 0; }
        .main-content {
            flex: 1;
            display: flex;
            justify-content: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
        }
        .toc-sidebar {
            position: fixed;
            left: 30px;
            top: 58%;
            transform: translateY(-50%);
            width: 200px;
            max-height: 60vh;
            overflow-y: auto;
            padding: 15px;
            background: rgba(79, 172, 254, 0.08);
            backdrop-filter: blur(8px);
            border-radius: 12px;
            border: 1px solid rgba(79, 172, 254, 0.15);
            transition: opacity 0.3s, transform 0.3s;
        }
        .toc-sidebar.hidden { opacity: 0; pointer-events: none; transform: translateY(-50%) translateX(-20px); }
        .toc-title {
            font-family: 'Orbitron';
            font-size: 0.7rem;
            color: var(--accent-blue);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 12px;
            padding-bottom: 8px;
            border-bottom: 1px solid rgba(79, 172, 254, 0.2);
        }
        .toc-toggle {
            position: fixed;
            left: 30px;
            top: 35%;
            transform: translateY(calc(-50% - 100px));
            width: 32px;
            height: 32px;
            border: 1px solid rgba(79, 172, 254, 0.3);
            background: rgba(79, 172, 254, 0.1);
            backdrop-filter: blur(8px);
            color: var(--accent-blue);
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            z-index: 50;
        }
        .toc-toggle:hover { background: rgba(79, 172, 254, 0.2); }
        .toc-list { list-style: none; padding: 0; margin: 0; }
        .toc-item { margin-bottom: 6px; }
        .toc-link {
            display: block;
            padding: 4px 10px;
            color: #666;
            text-decoration: none;
            font-size: 0.8rem;
            border-radius: 6px;
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .toc-link:hover { color: var(--accent-blue); }
        .toc-link.active { color: var(--accent-blue); border-left-color: var(--accent-blue); font-weight: 500; background: rgba(79, 172, 254, 0.1); }
        .toc-item.level-2 .toc-link { padding-left: 18px; font-size: 0.75rem; }
        .toc-item.level-3 .toc-link { padding-left: 26px; font-size: 0.7rem; }
        .toc-sidebar::-webkit-scrollbar { width: 3px; }
        .toc-sidebar::-webkit-scrollbar-track { background: transparent; }
        .toc-sidebar::-webkit-scrollbar-thumb { background: rgba(79, 172, 254, 0.3); border-radius: 3px; }
        #article-body h1, #article-body h2, #article-body h3 { scroll-margin-top: 20px; }

        @media (max-width: 1300px) {
            .layout { padding-left: 0; }
            .layout.toc-hidden { padding-left: 0; }
            .toc-sidebar { display: none; }
        }
    </style>
</head>
<body>

    <a id="backBtn" href="index.html" class="back-btn">← BACK</a>

    <button class="toc-toggle" id="toc-toggle">☰</button>

    <aside class="toc-sidebar" id="toc">
        <div class="toc-title">目录</div>
        <ul class="toc-list" id="toc-list"></ul>
    </aside>

    <div class="layout" id="layout">
        <div class="main-content">
            <div class="container">
                <h1 id="title" class="detail-title">Loading...</h1>
                <p id="meta" class="detail-meta"></p>

                <div id="article-body">
                    <p class="loading-tip">INITIALIZING...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="db.js"></script>
    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const id = urlParams.get('id');
        const type = urlParams.get('type') || 'project';

        const getData = type === 'note' ? getNoteById : getProjectById;
        const data = getData(id);

        if (data) {
            document.getElementById('backBtn').href = `index.html#${type === 'note' ? 'notes' : 'projects'}`;
            document.title = `${data.title} | Detail`;
            document.getElementById('title').innerText = data.title;
            document.getElementById('meta').innerText = `TS_DATE: ${data.date} // ID: #${data.id}`;

            fetch(data.path)
                .then(response => {
                    if (!response.ok) throw new Error("文件加载失败");
                    return response.text();
                })
                .then(text => {
                    document.getElementById('article-body').innerHTML = marked.parse(text);
                    hljs.highlightAll();
                    renderMathInElement(document.getElementById('article-body'), {
                        delimiters: [
                            {left: '$$', right: '$$', display: true},
                            {left: '$', right: '$', display: false}
                        ],
                        throwOnError: false
                    });
                    generateTOC();
                })
                .catch(err => {
                    document.getElementById('article-body').innerHTML = `<p style="color:red; text-align:center;">错误: ${err.message}</p>`;
                });
        } else {
            window.location.href = "index.html";
        }

        // 目录显示/隐藏
        const toc = document.getElementById('toc');
        const layout = document.getElementById('layout');
        const tocToggle = document.getElementById('toc-toggle');
        let tocVisible = true;

        tocToggle.addEventListener('click', function() {
            tocVisible = !tocVisible;
            if (tocVisible) {
                toc.classList.remove('hidden');
                layout.classList.remove('toc-hidden');
            } else {
                toc.classList.add('hidden');
                layout.classList.add('toc-hidden');
            }
        });

        function generateTOC() {
            const article = document.getElementById('article-body');
            const headings = article.querySelectorAll('h1, h2, h3');
            const tocList = document.getElementById('toc-list');

            if (headings.length === 0) {
                toc.style.display = 'none';
                return;
            }

            headings.forEach((heading, index) => {
                const id = 'heading-' + index;
                heading.id = id;

                const level = parseInt(heading.tagName.charAt(1));
                const li = document.createElement('li');
                li.className = 'toc-item level-' + level;

                const a = document.createElement('a');
                a.href = '#' + id;
                a.className = 'toc-link';
                a.textContent = heading.textContent;
                a.addEventListener('click', function(e) {
                    e.preventDefault();
                    heading.scrollIntoView({ behavior: 'smooth' });
                    history.pushState(null, '', '#' + id);
                });

                li.appendChild(a);
                tocList.appendChild(li);
            });

            const observer = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const link = document.querySelector('.toc-link[href="#' + entry.target.id + '"]');
                    if (link) {
                        if (entry.isIntersecting) {
                            document.querySelectorAll('.toc-link').forEach(l => l.classList.remove('active'));
                            link.classList.add('active');
                            link.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
                        }
                    }
                });
            }, { rootMargin: '-100px 0px -70% 0px' });

            headings.forEach(h => observer.observe(h));
        }
    </script>
</body>
</html>
